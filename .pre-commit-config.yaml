repos:
  -   repo: 'https://github.com/psf/black'
      rev: '24.10.0'
      hooks:
      -   id: black
  -   repo: https://github.com/pycqa/isort
      rev: '5.13.2'
      hooks:
      -   id: isort
  -   repo: 'https://github.com/pycqa/flake8'
      rev: '7.1.1'  
      hooks:
      -   id: flake8
          additional_dependencies:
            -   flake8-bugbear
            -   flake8-print
  - repo: local
    hooks:
      -     id: pylint
            name: pylint
            entry: 'python -m pylint'
            language: system
            types: [python]



  -   repo: 'https://github.com/pre-commit/mirrors-mypy'
      rev: v1.11.2
      hooks:
      -   id: mypy
          additional_dependencies: [types-requests==2.31.0.9]
          exclude: 'test/.*\.py'     
  -   repo: 'https://github.com/jazzband/pip-tools'
      rev: '7.4.1'
      hooks:
      -   id: pip-compile
          name: pip-compile requirements/prod.in (Python 3.8 x64)
          args: [requirements/3_8.in]
          files: ^requirements/3.8\.(in|txt)$
          language: system
          entry: .venv_3_8x64/Scripts/python.exe -m piptools compile

      -  id: pip-compile
         name: pip-compile requirements/prod.in (Python 3.12 x64)
         args: [requirements/3_12.in]
         files: ^requirements/3_12\.(in|txt)$
         language: system
         entry: .venv_3_12x64/Scripts/python.exe -m piptools compile
